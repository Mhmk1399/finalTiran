apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiran-app
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tiran-app
  template:
    metadata:
      labels:
        app: tiran-app
    spec:
      containers:
      - name: tiran-app
        image: docker.io/$DOCKERHUB_USER/tiran:${CI_COMMIT_SHA}
        ports:
        - containerPort: 3000
        env:
        - name: MONGODB_URI
          value: "mongodb+srv://hoseinzolghadr021:QNb0BV7Osu0Nflye@cluster0.vambg7i.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "250Mi"
            cpu: "500m"
            ephemeral-storage: "500Mi"
          limits:
            memory: "1000Mi"
            cpu: "1000m"
            ephemeral-storage: "500Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: tiran-service
  namespace: production
spec:
  selector:
    app: tiran-app
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP

